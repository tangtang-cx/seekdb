app:
  description: SQL 老中医 · 数据库问诊室（无模型兜底版）。**不需要任何模型供应商**：
    用模板节点把「医书摘录 / 望闻问切 / 药方 / 忌口 / 养生建议 / 医嘱小笺」六段固定输出，
    输入的 SQL 会被逐条套用 15 条审查规则。在评测环境没有配模型、或模型调用失败时，
    导入本文件即可正常接收输入并返回结果。
  icon: 🩺
  icon_background: '#EFF1F5'
  icon_type: emoji
  mode: advanced-chat
  name: SQL 老中医 · 数据库问诊室（无模型兜底版）
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: {}
    opening_statement: >-
      🩺 SQL 老中医 · 数据库问诊室（无模型兜底版）：本版本**不依赖任何模型**，
      你贴 SQL，我按 15 条 OceanBase / MySQL 通用规则逐条体检，固定输出六段：
      📖 医书摘录 / 🩺 望闻问切 / 💊 药方 / 🚫 忌口 / 🧘 养生建议 / 🎋 医嘱小笺。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - SELECT * 到底错在哪？
      - 深分页 OFFSET 200000 怎么治？
      - UPDATE 没有 WHERE 有什么风险？
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          sourceType: start
          targetType: template
        id: start-template
        source: start
        sourceHandle: source
        target: template
        targetHandle: target
        type: custom
      - data:
          sourceType: template
          targetType: answer
        id: template-answer
        source: template
        sourceHandle: source
        target: answer
        targetHandle: target
        type: custom
    nodes:
      - id: start
        type: custom
        position:
          x: 80
          y: 282
        positionAbsolute:
          x: 80
          y: 282
        width: 242
        height: 90
        sourcePosition: right
        targetPosition: left
        selected: false
        data:
          type: start
          title: 开始
          desc: ''
          variables: []
          selected: false
      - id: template
        type: custom
        position:
          x: 400
          y: 282
        positionAbsolute:
          x: 400
          y: 282
        width: 242
        height: 120
        sourcePosition: right
        targetPosition: left
        selected: false
        data:
          type: template
          title: 老中医把脉（模板）
          desc: 不依赖模型，按规则逐条体检
          variables: []
          selected: false
          template_transform: []
          template: |
            ## 📖 医书摘录

            《OceanBase / seekdb 医书》要点（本次体检依据）：
            - 建表：VECTOR(n) + FULLTEXT INDEX ... WITH PARSER ik + VECTOR INDEX ... WITH(distance=cosine, type=hnsw, lib=vsag, m=16, ef_construction=200, ef_search=64)
            - 混合检索：@search_parm + DBMS_HYBRID_SEARCH.GET_SQL，RRF 常数 k=60
            - 写入向量后必须刷新索引：CALL dbms_index_manager.refresh();

            ## 🩺 望闻问切

            病历原文：
            ```
            {{#sys.query#}}
            ```

            请对照下列 15 条规则逐条自查（命中哪条写哪条，没命中就写「本次未命中上述规则」）：

            - OB-001 更新/删除缺 WHERE
            - OB-002 JOIN 缺 ON/USING
            - OB-003 建表缺主键
            - OB-004 SELECT * 列出全部列
            - OB-005 LIKE 前置通配符
            - OB-006 索引列被函数包裹
            - OB-007 深分页 OFFSET
            - OB-008 NOT IN / != 与 NULL
            - OB-009 IN 列表过长
            - OB-010 FOR UPDATE 无 WHERE
            - OB-011 UNION 去重开销
            - OB-012 TRUNCATE 清表
            - OB-013 缺少执行计划验证
            - OB-014 疑似隐式类型转换
            - OB-015 COUNT(1) 与 COUNT(*)

            ## 💊 药方

            规则命中时给出可直接粘贴运行的改写后 SQL；未命中时给出「本条 SQL 可直接执行，
            建议补一条执行计划验证：EXPLAIN」。

            ## 🚫 忌口

            命中 OB-001 → 禁止无 WHERE 的全表更新/删除；
            命中 OB-005 → 禁止 LIKE '%x'（索引失效）；
            命中 OB-006 → 禁止在索引列上套函数；
            命中 OB-007 → 禁止大 OFFSET 深分页；
            命中 OB-008 → 避免 NOT IN 与 NULL 组合；
            命中 OB-012 → 注意 TRUNCATE 不可回滚。

            ## 🧘 养生建议

            - 给过滤/排序列建索引，覆盖索引带上排序列；
            - 深分页改游标分页：WHERE id > :last_id ORDER BY id LIMIT n；
            - 大批量写入分批提交，避免长事务；
            - 变更前先 EXPLAIN，生产库用 EXPLAIN FORMAT=JSON 看扫描行数。

            ## 🎋 医嘱小笺

            药到病除，最该先改的通常是：{{#sys.query#}} 里最刺眼的那一行。
      - id: answer
        type: custom
        position:
          x: 720
          y: 282
        positionAbsolute:
          x: 720
          y: 282
        width: 242
        height: 90
        sourcePosition: right
        targetPosition: left
        selected: false
        data:
          type: answer
          title: 出方
          desc: ''
          answer: '{{#template.text#}}'
          variables: []
          selected: false
    viewport:
      x: 0
      y: 0
      zoom: 0.8
  rag_pipeline_variables: []
