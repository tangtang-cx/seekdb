app:
  description: SQL 老中医 · 数据库问诊室。输入一段 SQL / DDL，工作流里的「规则体检」节点用 15 条 OceanBase / MySQL 反模式规则逐条判定，输出六段式诊断书（医书摘录 / 望闻问切 / 药方 / 忌口 / 养生建议 / 医嘱小笺）。全部在 Dify 工作流内完成，不需要任何模型供应商与外部服务。
  icon: 🩺
  icon_background: '#EFF1F5'
  icon_type: emoji
  mode: workflow
  name: SQL 老中医 · 数据库问诊室
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.3
