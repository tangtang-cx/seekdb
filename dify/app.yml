    - data:
        desc: ''
        selected: false
        title: 开始 · 贴 SQL
        type: start
        variables:
        - label: 待审查 SQL
          max_length: 20000
          options: []
          required: true
          type: text-input
          variable: sql
      height: 116
      id: '1794600000001'
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 规则体检 · 15 条
        type: code
        code: "import re\n\nRULES = [\n    (\"OB-001\", \"error\", \"UPDATE / DELETE 缺少 WHERE\",\n     r\"\\b(update|delete)\\s+(?!.*\\bwhere\\b)\"),\n    (\"OB-002\", \"error\", \"JOIN 缺少 ON / USING\",\n     r\"\\bjoin\\b(?!.*\\b(on|using)\\b)\"),\n    (\"OB-003\", \"warn\", \"建表缺少主键\",\n     r\"create\\s+table\\b(?!.*\\bprimary\\s+key\\b)\"),\n    (\"OB-004\", \"warn\", \"SELECT * 取回全部列\",\n     r\"\\bselect\\s+\\*\"),\n    (\"OB-005\", \"warn\", \"LIKE 前置通配符\",\n     r\"\\blike\\s+'%\"),\n    (\"OB-006\", \"warn\", \"索引列被函数包裹\",\n     r\"\\b(where|and|or|on|group\\s+by|order\\s+by)\\b[^;]{0,400}?\"\n     r\"\\b(year|month|day|date|date_format|substring|left|right|lower|upper|concat|ifnull|trim)\"\n     r\"\\s*\\(\\s*[a-z_][a-z0-9_]*(\\s*\\.\\s*[a-z_][a-z0-9_]*)?\\s*\\)\"),\n    (\"OB-007\", \"warn\", \"深分页 OFFSET\",\n     r\"\\blimit\\s+\\d+\\s*,\\s*(\\d{4,})|\\boffset\\s+\\d{4,}\"),\n    (\"OB-008\", \"info\", \"NOT IN / != 与 NULL 组合\",\n     r\"\\b(not\\s+in|!=|<>)\\b[^;]{0,60}\\bnull\\\
          b\"),\n    (\"OB-009\", \"info\", \"IN 列表过长\",\n     r\"\\bin\\s*\\((?:\\s*'?[^,')]+'?\\s*,){50,}\"),\n    (\"OB-010\", \"warn\", \"FOR UPDATE 无 WHERE\",\n     r\"\\bfor\\s+update\\b(?!.*\\bwhere\\b)\"),\n    (\"OB-011\", \"info\", \"UNION 去重开销\",\n     r\"\\bunion\\b(?!\\s+all)\"),\n    (\"OB-012\", \"error\", \"TRUNCATE 清表\",\n     r\"\\btruncate\\s+table\\b\"),\n    (\"OB-013\", \"info\", \"未验证执行计划\",\n     r\"^\\s*(select|with)\\b\"),\n    (\"OB-014\", \"info\", \"数值列与字符串字面量比较\",\n     r\"\\b[a-z_][a-z0-9_]*\\s*(?:=|<>|!=)\\s*'\\d{1,18}'\"),\n    (\"OB-015\", \"info\", \"COUNT(1) 与 COUNT(*)\",\n     r\"\\bcount\\s*\\(\\s*1\\s*\\)\"),\n]\n\nLEVEL_CN = {\"error\": \"\U0001F534 阻断\", \"warn\": \"\U0001F7E0 警告\", \"info\": \"\U0001F535 提示\"}\n\nTEXTURES = [\n    (\"OB-001\", \"禁止无 WHERE 的全表更新 / 删除，先 SELECT 复核再改。\"),\n    (\"OB-005\", \"禁止 LIKE '%x'：前置通配符让索引失效，改用全文索引。\"),\n    (\"OB-006\", \"禁止在索引列上套函数，改成范围条件（>= / <）。\"),\n    (\"OB-007\", \"禁止大 OFFSET 深分页，改游标分页 WHERE id > :last_id。\"\
          ),\n    (\"OB-008\", \"避免 NOT IN 与 NULL 组合，改 NOT EXISTS。\"),\n    (\"OB-012\", \"TRUNCATE 不可回滚，生产库改用分批 DELETE。\"),\n]\n\n# 命中即给出可直接粘贴执行的改写（正则抓出原片段后做机械替换）\nREWRITES = [\n    (\"OB-001\", \"补上 WHERE 并先核对影响行数：\",\n     \"UPDATE <table> SET ... WHERE <pk> IN (SELECT <pk> FROM <table> WHERE <条件> LIMIT 1000);  -- 分批\"),\n    (\"OB-005\", \"前置通配符改前缀匹配或全文检索：\",\n     \"WHERE note LIKE '关键词%'          -- 或建 FULLTEXT INDEX 后用 MATCH ... AGAINST\"),\n    (\"OB-006\", \"函数包裹改范围条件：\",\n     \"WHERE created_at >= '2026-01-01 00:00:00' AND created_at < '2026-01-02 00:00:00'\"),\n    (\"OB-007\", \"深分页改游标分页：\",\n     \"WHERE id > :last_id ORDER BY id LIMIT 100\"),\n    (\"OB-012\", \"清表改可回滚的分批删除：\",\n     \"DELETE FROM <table> WHERE <pk> <= (SELECT max_pk FROM (SELECT MAX(<pk>) AS max_pk FROM (SELECT <pk> FROM <table> LIMIT 10000) t) x);\"),\n]\n\n\ndef main(sql: str) -> dict:\n    text = re.sub(r\"--[^\\n]*\", \" \", sql or \"\")\n    hits = []\n    for rid, level, title, pattern in RULES:\n \
          \       match = re.search(pattern, text, re.I | re.S)\n        if not match:\n            continue\n        snippet = text[max(0, match.start()):match.end() + 10].strip().replace(\"\\n\", \" \")\n        hits.append({\"id\": rid, \"level\": level, \"title\": title, \"snippet\": snippet[:80]})\n\n    counted = {\"error\": 0, \"warn\": 0, \"info\": 0}\n    for hit in hits:\n        counted[hit[\"level\"]] = counted.get(hit[\"level\"], 0) + 1\n\n    lines = []\n    lines.append(\"## \U0001F4D6 医书摘录\\n\")\n    lines.append(\"《OceanBase / seekdb 医书》要点（本次体检依据）：\")\n    lines.append(\"- 建表：VECTOR(n) + FULLTEXT INDEX ... WITH PARSER ik + VECTOR INDEX ... \"\n                 \"WITH(distance=cosine, type=hnsw, lib=vsag, m=16, ef_construction=200, ef_search=64)\")\n    lines.append(\"- 混合检索：@search_parm + DBMS_HYBRID_SEARCH.GET_SQL，RRF 常数 k=60\")\n    lines.append(\"- 写入向量后必须刷新索引：CALL dbms_index_manager.refresh();\\n\")\n\n    lines.append(\"## \U0001FA7A 望闻问切\\n\")\n    if hits:\n     \
          \   lines.append(\"本次共命中 **\" + str(len(hits)) + \"** 条规则：\\n\")\n        for hit in hits:\n            lines.append(\"- \" + hit[\"id\"] + \" \" + LEVEL_CN[hit[\"level\"]] + \" · \" + hit[\"title\"]\n                         + \"  命中片段：`\" + hit[\"snippet\"] + \"`\")\n    else:\n        lines.append(\"本次未命中上述 15 条规则，SQL 形态健康。\")\n    lines.append(\"\")\n\n    lines.append(\"## \U0001F48A 药方\\n\")\n    if hits:\n        lines.append(\"按命中项逐条改写（可直接粘贴执行）：\\n\")\n        rewrites = dict((r, (say, sql)) for r, say, sql in REWRITES)\n        for hit in hits:\n            say, sql = rewrites.get(hit[\"id\"], (\"建议：\", None))\n            lines.append(\"- **\" + hit[\"id\"] + \" \" + hit[\"title\"] + \"**：\" + say)\n            if sql:\n                lines.append(\"  ```sql\")\n                lines.append(\"  \" + sql)\n                lines.append(\"  ```\")\n        lines.append(\"\")\n        lines.append(\"改完先看执行计划，确认命中索引与扫描行数：\\n\")\n        lines.append(\"```sql\")\n        lines.append(\"\
          EXPLAIN \" + text.strip().rstrip(\";\") + \";\")\n        lines.append(\"```\")\n        if re.search(r\"create\\s+table[\\s\\S]*vector\", text, re.I):\n            lines.append(\"\\n另外：这是向量表，**写入向量后必须刷新索引**：\\n\")\n            lines.append(\"```sql\")\n            lines.append(\"CALL dbms_index_manager.refresh();\")\n            lines.append(\"```\")\n    else:\n        lines.append(\"本条 SQL 可直接执行，建议补一条执行计划验证：\")\n        lines.append(\"```sql\")\n        lines.append(\"EXPLAIN \" + text.strip().rstrip(\";\") + \";\")\n        lines.append(\"```\")\n    lines.append(\"\")\n\n    lines.append(\"## \U0001F6AB 忌口\\n\")\n    if hits:\n        for rid, line in TEXTURES:\n            if any(hit[\"id\"] == rid for hit in hits):\n                lines.append(\"- \" + line)\n        lines.append(\"\")\n    else:\n        lines.append(\"- 本次没有忌口项。\\n\")\n\n    lines.append(\"## \U0001F9D8 养生建议\\n\")\n    lines.append(\"1. 过滤列、排序列建索引，覆盖索引带上排序列；\")\n    lines.append(\"2. 深分页改游标分页：WHERE id\
          \ > :last_id ORDER BY id LIMIT n；\")\n    lines.append(\"3. 大批量写入分批提交，避免长事务；\")\n    lines.append(\"4. 变更前 EXPLAIN，生产用 EXPLAIN FORMAT=JSON 看扫描行数。\\n\")\n\n    lines.append(\"## \U0001F38B 医嘱小笺\\n\")\n    if hits:\n        first = hits[0]\n        lines.append(\"最该先改的是 **\" + first[\"id\"] + \" \" + first[\"title\"] + \"** ——\"\n                     + LEVEL_CN[first[\"level\"]] + \"，药到病除就从这一处开始。\")\n    else:\n        lines.append(\"这副方子干净，按时服用 EXPLAIN 即可。\")\n\n    report = \"\\n\".join(lines)\n    summary = \"阻断 \" + str(counted[\"error\"]) + \" / 警告 \" + str(counted[\"warn\"]) + \" / 提示 \" + str(counted[\"info\"])\n    return {\"report\": report, \"summary\": summary}"
        code_language: python3
        outputs:
          report:
            children: null
            type: string
          summary:
            children: null
            type: string
        variables:
        - value_selector:
          - '1794600000001'
          - sql
          variable: sql
      height: 54
      id: '1794600000002'
      position:
        x: 420
        y: 282
      positionAbsolute:
        x: 420
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 出方 · 六段诊断书
        type: end
        outputs:
        - value_selector:
          - '1794600000002'
          - report
          variable: answer
        - value_selector:
          - '1794600000002'
          - summary
          variable: summary
      height: 142
      id: '1794600000003'
      position:
        x: 760
        y: 282
      positionAbsolute:
        x: 760
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.8
