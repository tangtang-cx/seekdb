services:
  # The Qoder review assistant (Streamlit).
  #   docker compose up --build
  #   -> http://localhost:8501
  # The seekdb knowledge service is optional: without it the assistant still
  # runs (rules + optional LLM), it just has no "医书" citations and stores no
  # review history.  Start it with:
  #   docker compose --profile seekdb up -d
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qoder-review-assistant
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      SEEKDB_SERVICE_URL: "http://seekdb-service:8848"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  seekdb-service:
    profiles: ["seekdb"]
    image: python:3.11-slim
    container_name: qoder-seekdb-service
    working_dir: /app
    depends_on:
      seekdb:
        condition: service_healthy
    ports:
      - "8848:8848"
    environment:
      SEEKDB_HOST: seekdb
      SEEKDB_PORT: "2881"
      SEEKDB_USER: root
      SEEKDB_PASSWORD: ""
      SEEKDB_DATABASE: test
      BGE_MODEL_DIR: /app/models
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../dify/seekdb_service:/app/dify/seekdb_service:ro
      - ./models:/app/models
    command: >
      bash -c "pip install --no-cache-dir -r /app/dify/seekdb_service/requirements.txt &&
               python /app/dify/seekdb_service/fetch_model.py || true;
               python /app/dify/seekdb_service/serve.py --host 0.0.0.0 --port 8848"
    restart: unless-stopped

  seekdb:
    image: oceanbase/seekdb:latest
    container_name: qoder-seekdb
    profiles: ["seekdb"]
    ports:
      - "2881:2881"
    environment:
      ROOT_PASSWORD: ""
      CPU_COUNT: "4"
      MEMORY_LIMIT: "4G"
    volumes:
      - ./data/seekdb:/var/lib/oceanbase
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/2881' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
